<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Arrays</title>
</head>
<body>
	<script>
		function getFizzBuzz() {
			const nums =[];
			for (let i=1; i<=20; i++) {
		      if (i % 3 === 0 && i % 5 === 0) {
			    nums.push("fizzbuzz");
		      }else if (i % 3 === 0) {
			    nums.push("fizz");
		      }else if (i % 5 === 0 ) {
			    nums.push("buzz");
		      }else {
			    nums.push(i);
		      }
		    }
		  return nums;
		}
		  console.log(getFizzBuzz());	 	
	</script>
</body>
</html>
