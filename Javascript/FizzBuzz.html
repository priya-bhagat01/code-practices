<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Arrays</title>
</head>
<body>
	<script>
		for (let i=1; i<=20; i++) {
			if (i % 3 === 0) {
				console.log('fizz')
			} else if (i % 5 === 0) {
				console.log('buzz')
			}else if (i % 3 === 0 && i % 5 === 0) {
				console.log('fizzbuzz')
			} else {
				console.log(i)
			}
		}
		
	</script>
</body>
</html>
