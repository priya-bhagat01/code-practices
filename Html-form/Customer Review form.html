<!DOCTYPE html>
<html>
<head>
	<title>Product Review Form</title>
</head>
<center><h1>Customer Review</h1></center><br><hr>
<body>
<p><b>Share Your Thoughts About Your Recent Purchase</b></p><br>
<form>
     <label>Item Purchased:</label>
     <select required="">
	    <option value="--Choose an Item--">--Choose an Item--</option>
	    <option value="SkinCare">Facewash</option>
	    <option value="BodyCare">Soap</option>
	    <option value="HairCare">Hair Serum</option>
	    <option value="Lotion">Body Lotion</option>
	    <option value="Mask">Face Mask</option></select> <br><br>
	   <div> <label>Overall Rating:</label><br>
	    <input type="radio" name="Rating" value="1*">1*
	    <input type="radio" name="Rating" value="2*">2*
	    <input type="radio" name="Rating" value="3*">3*
	    <input type="radio" name="Rating" value="4*">4*
	    <input type="radio" name="Rating" value="5*">5*</div><br>
	    <label>Value for Money(1 to 10):</label><br>
	    <div><span>Poor</span>
	    <input type="text" name="Value Score" min="1" max="10" required="">
	    <span>Excellent</span></div><br>
	    <label>Review Title:</label>
	    <textarea rows="1" cols="30" required="">Summarize Your Main Point</textarea><br><br>
	    <label>Written Review:</label>
	    <textarea rows="3" cols="70" required="">
	     What do you Like or Dislike about our Product?
	                  (Minimum 20 Characters)</textarea><br>
	    
	    	<input type="checkbox" name="Recommendation" >I would Recommend this Product to a Friend
	    <br>
	    <button>Submit Response</button>
	</form>


	    	
	    









</body>
</html>
